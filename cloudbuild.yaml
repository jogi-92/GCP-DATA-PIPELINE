substitutions:
  _PROJECT_ID: project-6e64a1a1-8e69-4a88-93d

steps:

  # STEP 1: Install dependencies
  - name: "python:3.11"
    id: "install-deps"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install --user \
          google-cloud-bigquery==3.11.4 \
          google-cloud-storage==2.10.0
        echo "✅ Dependencies installed"

  # STEP 2: Deploy DEV
  - name: "python:3.11"
    id: "deploy-dev"
    entrypoint: bash
    args:
      - "-c"
      - |
        export PYTHONPATH="/builder/home/.local/lib/python3.11/site-packages"
        export PROJECT_ID="${_PROJECT_ID}"
        echo "Using PROJECT_ID: $$PROJECT_ID"
        python pipeline/load_to_bq.py dev
    waitFor: ["install-deps"]

  # STEP 3: Validate DEV
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "validate-dev"
    entrypoint: bash
    args:
      - "-c"
      - |
        bq query \
          --project_id="${_PROJECT_ID}" \
          --nouse_legacy_sql \
          --format=csv \
          --quiet=true \
          "SELECT COUNT(*) as row_count FROM \`${_PROJECT_ID}.dev_dataset.users\`" \
          > /tmp/result.txt 2>&1
        cat /tmp/result.txt
        ROW_COUNT=$$(grep -E '^[0-9]+$' /tmp/result.txt | head -1 | tr -d ' \r\n')
        echo "Row count: [$$ROW_COUNT]"
        if [ -n "$$ROW_COUNT" ] && [ "$$ROW_COUNT" -gt 0 ]; then
          echo "✅ DEV validation passed"
        else
          echo "❌ DEV validation FAILED"
          exit 1
        fi
    waitFor: ["deploy-dev"]

  # STEP 4a: Copy CSV DEV → PRE-PROD (uses cloud-sdk which HAS gsutil)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "copy-to-preprod"
    entrypoint: bash
    args:
      - "-c"
      - |
        gsutil cp gs://${_PROJECT_ID}-dev-data-bucket/input/sample.csv \
                  gs://${_PROJECT_ID}-preprod-data-bucket/input/sample.csv
        echo "✅ CSV copied to preprod bucket"
    waitFor: ["validate-dev"]

  # STEP 4b: Deploy PRE-PROD
  - name: "python:3.11"
    id: "deploy-preprod"
    entrypoint: bash
    args:
      - "-c"
      - |
        export PYTHONPATH="/builder/home/.local/lib/python3.11/site-packages"
        export PROJECT_ID="${_PROJECT_ID}"
        python pipeline/load_to_bq.py preprod
    waitFor: ["copy-to-preprod"]

  # STEP 5: Validate PRE-PROD
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "validate-preprod"
    entrypoint: bash
    args:
      - "-c"
      - |
        bq query \
          --project_id="${_PROJECT_ID}" \
          --nouse_legacy_sql \
          --format=csv \
          --quiet=true \
          "SELECT COUNT(*) as row_count FROM \`${_PROJECT_ID}.preprod_dataset.users\`" \
          > /tmp/result.txt 2>&1
        cat /tmp/result.txt
        ROW_COUNT=$$(grep -E '^[0-9]+$' /tmp/result.txt | head -1 | tr -d ' \r\n')
        echo "Row count: [$$ROW_COUNT]"
        if [ -n "$$ROW_COUNT" ] && [ "$$ROW_COUNT" -gt 0 ]; then
          echo "✅ PRE-PROD validation passed"
        else
          echo "❌ PRE-PROD validation FAILED"
          exit 1
        fi
    waitFor: ["deploy-preprod"]

  # STEP 6a: Copy CSV PRE-PROD → PROD
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "copy-to-prod"
    entrypoint: bash
    args:
      - "-c"
      - |
        gsutil cp gs://${_PROJECT_ID}-preprod-data-bucket/input/sample.csv \
                  gs://${_PROJECT_ID}-prod-data-bucket/input/sample.csv
        echo "✅ CSV copied to prod bucket"
    waitFor: ["validate-preprod"]

  # STEP 6b: Deploy PROD
  - name: "python:3.11"
    id: "deploy-prod"
    entrypoint: bash
    args:
      - "-c"
      - |
        export PYTHONPATH="/builder/home/.local/lib/python3.11/site-packages"
        export PROJECT_ID="${_PROJECT_ID}"
        python pipeline/load_to_bq.py prod
    waitFor: ["copy-to-prod"]

  # STEP 7: Validate PROD
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "validate-prod"
    entrypoint: bash
    args:
      - "-c"
      - |
        bq query \
          --project_id="${_PROJECT_ID}" \
          --nouse_legacy_sql \
          --format=csv \
          --quiet=true \
          "SELECT COUNT(*) as row_count FROM \`${_PROJECT_ID}.prod_dataset.users\`" \
          > /tmp/result.txt 2>&1
        cat /tmp/result.txt
        ROW_COUNT=$$(grep -E '^[0-9]+$' /tmp/result.txt | head -1 | tr -d ' \r\n')
        echo "Row count: [$$ROW_COUNT]"
        if [ -n "$$ROW_COUNT" ] && [ "$$ROW_COUNT" -gt 0 ]; then
          echo "✅ PROD LIVE!"
        else
          echo "❌ PROD validation FAILED"
          exit 1
        fi
    waitFor: ["deploy-prod"]

options:
  logging: CLOUD_LOGGING_ONLY